<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>128 Neuron AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#fff;font-family:Arial,sans-serif}header{height:70px;background:#101522;border-bottom:1px solid #252c3d;display:flex;align-items:center;padding:0 25px;gap:20px}header h1{margin:0;font-size:22px}.status{color:#6ee7ff}main{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 70px)}#panel{background:#0d111c;border-right:1px solid #252c3d;padding:20px;overflow-y:auto}#panel h2{font-size:16px;margin-top:0}.box{background:#151b2a;border:1px solid #283044;border-radius:10px;padding:14px;margin-bottom:15px}label{display:block;margin-top:10px;margin-bottom:5px;font-size:13px;color:#aeb8cc}input,button{width:100%;padding:10px;border-radius:7px;border:1px solid #30394e;background:#0c1019;color:white}button{cursor:pointer;margin-top:8px;background:#182337}button:hover{background:#243451}.primary{background:#155e75}.primary:hover{background:#0e7490}#network{position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#0c1019;border-radius:7px;padding:10px;text-align:center}.stat b{display:block;font-size:18px;margin-top:4px}#log{height:150px;overflow-y:auto;background:#070a10;padding:8px;border-radius:6px;font-size:11px;color:#9ba8c0}.prediction{font-size:25px;text-align:center;padding:15px}@media(max-width:800px){main{grid-template-columns:1fr}#panel{height:auto;max-height:50vh}#network{min-height:500px}}
</style>
</head>
<body>
<header><h1>🧠 128 Neuron AI</h1><span class="status" id="status">대기 중</span></header>
<main><aside id="panel">
<div class="box"><h2>신경망 구조</h2><div class="stats"><div class="stat">입력<b>8</b></div><div class="stat">은닉 1<b>64</b></div><div class="stat">은닉 2<b>48</b></div><div class="stat">출력<b>8</b></div></div><p>총 뉴런: <strong id="neuronCount">128</strong></p></div>
<div class="box"><h2>학습</h2><label>Epoch</label><input id="epochs" type="number" value="500"><label>학습률</label><input id="learningRate" type="number" value="0.03" step="0.001"><button class="primary" id="trainBtn">AI 학습 시작</button><button id="resetBtn">초기화</button></div>
<div class="box"><h2>테스트 입력</h2><input id="testInput" value="1,0,1,0,1,0,1,0"><button id="predictBtn">AI에게 질문</button><div class="prediction" id="prediction">-</div></div>
<div class="box"><h2>학습 상태</h2><div class="stats"><div class="stat">Epoch<b id="epochText">0</b></div><div class="stat">Loss<b id="lossText">0</b></div></div></div>
<div class="box"><h2>AI 로그</h2><div id="log"></div></div>
</aside><section id="network"><canvas id="canvas"></canvas></section></main>
<script>
const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");
const layers=[8,64,48,8],TOTAL_NEURONS=layers.reduce((a,b)=>a+b,0);document.getElementById("neuronCount").textContent=TOTAL_NEURONS;
class NeuralNetwork{constructor(sizes){this.sizes=sizes;this.weights=[];this.biases=[];for(let l=1;l<sizes.length;l++){const rows=sizes[l],cols=sizes[l-1],m=[];for(let i=0;i<rows;i++){const r=[];for(let j=0;j<cols;j++)r.push((Math.random()*2-1)*Math.sqrt(2/cols));m.push(r)}this.weights.push(m);this.biases.push(new Array(rows).fill(0))}this.activations=[];this.zValues=[]}
relu(x){return Math.max(0,x)}reluDerivative(x){return x>0?1:0}
softmax(v){const max=Math.max(...v),e=v.map(x=>Math.exp(x-max)),s=e.reduce((a,b)=>a+b,0);return e.map(x=>x/s)}
forward(input){this.activations=[input.slice()];this.zValues=[];let a=input.slice();for(let l=0;l<this.weights.length;l++){const W=this.weights[l],b=this.biases[l],z=[];for(let i=0;i<W.length;i++){let sum=b[i];for(let j=0;j<W[i].length;j++)sum+=W[i][j]*a[j];z.push(sum)}this.zValues.push(z);a=l===this.weights.length-1?this.softmax(z):z.map(x=>this.relu(x));this.activations.push(a)}return a}
train(input,target,lr){const output=this.forward(input),deltas=[];deltas.push(output.map((x,i)=>x-target[i]));for(let l=this.weights.length-2;l>=0;l--){const z=this.zValues[l],nw=this.weights[l+1],nd=deltas[0],d=[];for(let i=0;i<z.length;i++){let e=0;for(let j=0;j<nd.length;j++)e+=nw[j][i]*nd[j];d.push(e*this.reluDerivative(z[i]))}deltas.unshift(d)}for(let l=0;l<this.weights.length;l++){const a=this.activations[l],d=deltas[l];for(let i=0;i<this.weights[l].length;i++){for(let j=0;j<this.weights[l][i].length;j++)this.weights[l][i][j]-=lr*d[i]*a[j];this.biases[l][i]-=lr*d[i]}}let loss=0;for(let i=0;i<target.length;i++)loss-=target[i]*Math.log(output[i]+1e-10);return loss}
predict(input){const output=this.forward(input);let index=0;for(let i=1;i<output.length;i++)if(output[i]>output[index])index=i;return{index,probabilities:output}}}
let brain=new NeuralNetwork(layers),trainingData=[];for(let i=0;i<8;i++){const input=new Array(8).fill(0),target=new Array(8).fill(0);input[i]=1;target[i]=1;trainingData.push({input,target})}
function resizeCanvas(){canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}window.addEventListener("resize",resizeCanvas);resizeCanvas();
function getNeuronPositions(){const w=canvas.clientWidth,h=canvas.clientHeight,m=100,uw=w-m*2,p=[];for(let l=0;l<layers.length;l++){const x=m+(uw/(layers.length-1))*l,count=layers[l],uh=h-80;for(let i=0;i<count;i++)p.push({layer:l,index:i,x,y:40+(uh/Math.max(count-1,1))*i})}return p}
function drawNetwork(){ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);const pos=getNeuronPositions();for(let l=0;l<layers.length-1;l++){const cur=pos.filter(p=>p.layer===l),next=pos.filter(p=>p.layer===l+1);for(const a of cur)for(const b of next){const weight=brain.weights[l][b.index][a.index];ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.globalAlpha=.03+Math.min(Math.abs(weight),1)*.25;ctx.lineWidth=1;ctx.strokeStyle=weight>=0?"#42d4ff":"#ff4d8d";ctx.stroke()}}ctx.globalAlpha=1;for(const p of pos){let activation=0;if(brain.activations[p.layer]?.[p.index])activation=brain.activations[p.layer][p.index];const radius=p.layer===0||p.layer===layers.length-1?7:5,glow=Math.min(Math.abs(activation),1);ctx.beginPath();ctx.arc(p.x,p.y,radius+glow*4,0,Math.PI*2);ctx.globalAlpha=.3+glow*.7;ctx.fillStyle=activation>=0?"#54e1ff":"#ff5c93";ctx.fill();ctx.globalAlpha=1}ctx.fillStyle="#fff";ctx.font="13px Arial";ctx.textAlign="center";const labels=["INPUT","HIDDEN 1","HIDDEN 2","OUTPUT"],w=canvas.clientWidth,m=100,uw=w-m*2;for(let i=0;i<layers.length;i++){const x=m+(uw/(layers.length-1))*i;ctx.fillText(labels[i]+" ("+layers[i]+")",x,22)}}
function animate(){drawNetwork();requestAnimationFrame(animate)}animate();
function log(message){const e=document.getElementById("log"),line=document.createElement("div");line.textContent=message;e.appendChild(line);e.scrollTop=e.scrollHeight}
let training=false;async function trainAI(){if(training)return;training=true;const epochs=Number(document.getElementById("epochs").value),lr=Number(document.getElementById("learningRate").value);document.getElementById("status").textContent="학습 중...";log("AI 학습 시작");log("뉴런: "+TOTAL_NEURONS);for(let epoch=0;epoch<epochs;epoch++){let totalLoss=0;const data=[...trainingData].sort(()=>Math.random()-.5);for(const s of data)totalLoss+=brain.train(s.input,s.target,lr);const loss=totalLoss/data.length;document.getElementById("epochText").textContent=epoch+1;document.getElementById("lossText").textContent=loss.toFixed(5);if(epoch%10===0){log("Epoch "+(epoch+1)+" | Loss: "+loss.toFixed(5));await new Promise(r=>setTimeout(r,0))}}training=false;document.getElementById("status").textContent="학습 완료";log("AI 학습 완료")}
function predictAI(){const input=document.getElementById("testInput").value.split(",").map(Number);if(input.length!==8){alert("입력값은 정확히 8개여야 합니다.");return}const r=brain.predict(input),prob=(r.probabilities[r.index]*100).toFixed(2);document.getElementById("prediction").textContent="→ "+r.index+"번 뉴런 ("+prob+"%)";log("입력: "+input.join(", "));log("예측: "+r.index)}
function resetAI(){brain=new NeuralNetwork(layers);document.getElementById("epochText").textContent="0";document.getElementById("lossText").textContent="0";document.getElementById("prediction").textContent="-";document.getElementById("status").textContent="초기화됨";log("신경망 초기화")}
document.getElementById("trainBtn").addEventListener("click",trainAI);document.getElementById("predictBtn").addEventListener("click",predictAI);document.getElementById("resetBtn").addEventListener("click",resetAI);
</script></body></html>
